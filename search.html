    <main class="container">
        <h1>البحث</h1>
        <p class="subtitle">ابحث في السيرة والخط الزمني والأحداث</p>
        
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="اكتب كلمة البحث...">
        </div>

        <div class="search-results" id="searchResults"></div>

    </footer>

    <script src="js/data-loader.js"></script>
    <script>
        let allData = {};
        
        async function loadData() {
            try {
                const [bio, timeline, events] = await Promise.all([
                    fetch('data/biography.json').then(r => r.json()),
                    fetch('data/timeline.json').then(r => r.json()),
                    fetch('data/events.json').then(r => r.json())
                ]);
                allData = { biography: bio, timeline: timeline, events: events };
            } catch (error) {
                console.error('خطأ في تحميل البيانات:', error);
            }
        }

        function search(query) {
            if (!query || query.length < 2) {
                document.getElementById('searchResults').innerHTML = '';
                return;
            }

            const results = [];
            const q = query.toLowerCase();

            // بحث في السيرة
            if (allData.biography) {
                const bio = JSON.stringify(allData.biography).toLowerCase();
                if (bio.includes(q)) {
                    results.push({ type: 'السيرة', title: 'معلومات السيرة', text: 'تم العثور على النتيجة' });
                }
            }

            // بحث في الخط الزمني
            if (allData.timeline && allData.timeline.events) {
                allData.timeline.events.forEach(event => {
                    if (event.title.toLowerCase().includes(q) || event.description.toLowerCase().includes(q)) {
                        results.push({ type: 'خط زمني', title: event.date + ' - ' + event.title, text: event.description });
                    }
                });
            }

            // بحث في الأحداث
            if (allData.events && allData.events.events) {
                allData.events.events.forEach(event => {
                    if (event.title.toLowerCase().includes(q) || event.description.toLowerCase().includes(q)) {
                        results.push({ type: 'حدث', title: event.title, text: event.description });
                    }
                });
            }

            const container = document.getElementById('searchResults');
            if (results.length === 0) {
                container.innerHTML = '<p>لم يتم العثور على نتائج</p>';
            } else {
                container.innerHTML = results.map(result => `
                    <div class="result-item">
                        <span class="source-type">${result.type}</span>
                        <div class="result-title">${result.title}</div>
                        <div class="result-text">${result.text}</div>
                    </div>
                `).join('');
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            search(e.target.value);
        });

        loadData();
    </script>
