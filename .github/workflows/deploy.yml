name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Validate data
        run: npm run validate

      - name: Build website
        run: npm run build

      - name: Generate PDF exports
        run: npm run pdf
        continue-on-error: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
          cname: wissa-sobhy-archive.com
        if: github.ref == 'refs/heads/main'

      - name: Notify deployment
        if: success()
        run: |
          echo "✓ Deployment successful!"
          echo "Website: https://bishoelkomos.github.io/wissa-sobhy-archive/"
