    <main class="container">
        <section class="timeline-container">
            <h1>الخط الزمني الكامل</h1>
            <p class="subtitle">سجل زمني لحياة وخدمة القمص ويصا صبحي تادرس من 1956 إلى 2026</p>

            <div id="timeline-content" aria-live="polite">جاري تحميل البيانات...</div>

            <noscript>
                <section class="archive-fallback">
                    <h2>محطات أساسية في السجل</h2>
                    <ol>
                        <li><strong>4 ديسمبر 1956:</strong> الميلاد في طنطا.</li>
                        <li><strong>1980:</strong> الحصول على بكالوريوس التجارة من جامعة طنطا.</li>
                        <li><strong>1988:</strong> الانتقال إلى ديرمواس للعمل مع الأنبا أغابيوس، بحسب السجل الحالي.</li>
                        <li><strong>10 فبراير 1991:</strong> الزواج.</li>
                        <li><strong>11 فبراير 1991:</strong> السيامة الكهنوتية.</li>
                        <li><strong>فبراير–مارس 1991:</strong> فترة الأربعين يومًا بدير السيدة العذراء بالمحرق، وفق المصدر المسجل.</li>
                        <li><strong>22 يونيو 1997:</strong> رفع درجة القمصية.</li>
                        <li><strong>14 أغسطس 2013:</strong> أحداث الهجمات على كنائس وممتلكات مسيحية في ديرمواس ودلجا.</li>
                        <li><strong>2025:</strong> وفاة الأنبا أغابيوس ثم سيامة وتجليس الأنبا بقطر في مناسبتين منفصلتين.</li>
                        <li><strong>2026:</strong> مرور 35 عامًا على السيامة الكهنوتية.</li>
                    </ol>
                    <p>يمكن فتح نسخة البيانات الكاملة من صفحة <a href="sources.html">المصادر</a> أو تفعيل JavaScript لعرض الخط الزمني التفاعلي.</p>
                </section>
            </noscript>
        </section>
    </main>

    <footer class="footer">

    </footer>

    <script src="js/data-loader.js"></script>
    <script>
        async function loadTimeline() {
            try {
                const response = await fetch('data/timeline.json');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                const timeline = data.events || data.timeline || [];
                const container = document.getElementById('timeline-content');
                if (!timeline.length) throw new Error('No timeline records found');
                container.innerHTML = timeline.map(event => `
                    <article class="timeline-item">
                        <div class="timeline-dot" aria-hidden="true"></div>
                        <div class="timeline-date">${event.date || event.date_arabic || event.year}</div>
                        <h2 class="timeline-title">${event.title}</h2>
                        <div class="timeline-desc">${event.description || ''}</div>
                    </article>
                `).join('');
            } catch (error) {
                console.error('خطأ في تحميل البيانات:', error);
                document.getElementById('timeline-content').innerHTML = '<p>تعذر تحميل السجل التفاعلي. يمكن الرجوع إلى المحطات الأساسية أدناه.</p>';
            }
        }
        loadTimeline();
    </script>
