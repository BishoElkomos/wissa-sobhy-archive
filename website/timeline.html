<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="الخط الزمني الكامل لحياة القمص ويصا صبحي تادرس - 43 حدثاً موثقاً من 1956 إلى 2026">
    <title>الخط الزمني | أرشيف القمص ويصا صبحي</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .timeline-container { max-width: 900px; margin: 3rem auto; padding: 0 1rem; }
        .timeline-item { 
            position: relative; 
            padding-bottom: 2rem; 
            border-left: 3px solid #1a472a;
            padding-left: 2rem;
            margin-left: 1rem;
        }
        .timeline-item:last-child { border-left-color: transparent; }
        .timeline-dot {
            position: absolute;
            left: -8px;
            top: 0;
            width: 12px;
            height: 12px;
            background: #1a472a;
            border-radius: 50%;
        }
        .timeline-date { 
            font-weight: bold; 
            color: #1a472a;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        .timeline-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 0.3rem; }
        .timeline-desc { color: #666; font-size: 0.95rem; line-height: 1.6; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">القمص ويصا صبحي</a>
            <ul class="nav-menu">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="biography.html">السيرة</a></li>
                <li><a href="timeline.html" class="active">الخط الزمني</a></li>
                <li><a href="events.html">الأحداث</a></li>
                <li><a href="media.html">الوسائط</a></li>
                <li><a href="sources.html">المصادر</a></li>
                <li><a href="search.html">البحث</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="timeline-container">
            <h1>الخط الزمني الكامل</h1>
            <p class="subtitle">43 حدثاً موثقاً من حياة القمص ويصا صبحي تادرس</p>
            <div id="timeline-content">جاري تحميل البيانات...</div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 أرشيف القمص ويصا صبحي تادرس</p>
        <p><a href="https://github.com/BishoElkomos/wissa-sobhy-archive">GitHub</a> | <a href="mailto:contribute@wissa-archive.com">تواصل معنا</a></p>
    </footer>

    <script src="js/data-loader.js"></script>
    <script>
        async function loadTimeline() {
            try {
                const response = await fetch('data/timeline.json');
                const timeline = await response.json();
                const container = document.getElementById('timeline-content');
                container.innerHTML = timeline.events.map(event => `
                    <div class="timeline-item">
                        <div class="timeline-dot"></div>
                        <div class="timeline-date">${event.date}</div>
                        <div class="timeline-title">${event.title}</div>
                        <div class="timeline-desc">${event.description}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('خطأ في تحميل البيانات:', error);
                document.getElementById('timeline-content').innerHTML = '<p>عذراً، حدث خطأ في تحميل البيانات</p>';
            }
        }
        loadTimeline();
    </script>
</body>
</html>
