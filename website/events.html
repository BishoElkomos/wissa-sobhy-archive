<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="الأحداث الرئيسية في حياة القمص ويصا صبحي - 4 أحداث محددة الأهمية">
    <title>الأحداث الرئيسية | أرشيف القمص ويصا صبحي</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .events-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin: 2rem 0; }
        .event-card { 
            background: #f9f9f9; 
            border-right: 4px solid #1a472a;
            padding: 1.5rem; 
            border-radius: 8px;
        }
        .event-year { color: #1a472a; font-weight: bold; font-size: 1.3rem; }
        .event-title { font-size: 1.2rem; font-weight: 600; margin: 0.5rem 0; }
        .event-desc { color: #666; line-height: 1.8; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">القمص ويصا صبحي</a>
            <ul class="nav-menu">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="biography.html">السيرة</a></li>
                <li><a href="timeline.html">الخط الزمني</a></li>
                <li><a href="events.html" class="active">الأحداث</a></li>
                <li><a href="media.html">الوسائط</a></li>
                <li><a href="sources.html">المصادر</a></li>
                <li><a href="search.html">البحث</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <h1>الأحداث الرئيسية</h1>
        <p class="subtitle">أهم 4 أحداث في حياة القمص ويصا صبحي تادرس</p>
        
        <div class="events-grid" id="events-content">
            جاري تحميل البيانات...
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 أرشيف القمص ويصا صبحي تادرس</p>
        <p><a href="https://github.com/BishoElkomos/wissa-sobhy-archive">GitHub</a> | <a href="mailto:contribute@wissa-archive.com">تواصل معنا</a></p>
    </footer>

    <script src="js/data-loader.js"></script>
    <script>
        async function loadEvents() {
            try {
                const response = await fetch('data/events.json');
                const data = await response.json();
                const container = document.getElementById('events-content');
                container.innerHTML = data.events.map(event => `
                    <div class="event-card">
                        <div class="event-year">${event.year}</div>
                        <div class="event-title">${event.title}</div>
                        <div class="event-desc">${event.description}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('خطأ:', error);
                document.getElementById('events-content').innerHTML = '<p>عذراً، حدث خطأ</p>';
            }
        }
        loadEvents();
    </script>
</body>
</html>
